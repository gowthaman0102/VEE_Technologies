<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 160) rotate(90) scale(240 280)">
      <stop offset="0" stop-color="#5B48C7" stop-opacity="0.95"/>
      <stop offset="0.38" stop-color="#211A56" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#070B1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 210) rotate(90) scale(380 600)">
      <stop offset="0" stop-color="#A06CFF" stop-opacity="0.80"/>
      <stop offset="0.38" stop-color="#4B39A7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#070B1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 250) rotate(90) scale(295 330)">
      <stop offset="0" stop-color="#C9B5FF" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#7C5BFF" stop-opacity="0.65"/>
      <stop offset="0.68" stop-color="#110D2D" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#050915" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="planetCore" x1="704" y1="90" x2="1360" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1A4B"/>
      <stop offset="0.52" stop-color="#100E2D"/>
      <stop offset="1" stop-color="#050915"/>
    </linearGradient>
    <linearGradient id="orbitLine" x1="820" y1="90" x2="1460" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EADFFF" stop-opacity="0.92"/>
      <stop offset="0.32" stop-color="#BFA4FF" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#9280FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F5EDFF" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .orbit-slow { animation: orbitSlow 18s linear infinite; transform-origin: 1060px 270px; }
      .orbit-fast { animation: orbitFast 12s linear infinite; transform-origin: 1060px 270px; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .node { animation: nodePulse 2.8s ease-in-out infinite; }
      .star { animation: twinkle 3.2s ease-in-out infinite alternate; }
      @keyframes orbitSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes orbitFast { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.7; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes nodePulse { 0%,100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes twinkle { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    </style>
  </defs>

